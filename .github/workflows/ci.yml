name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python -m unittest -v
      - name: Check the template
        run: python template/projectkeeper.py
      - name: Check projectkeeper's own planning folder
        run: python template/projectkeeper.py --dir planning
